x-app: &app
    build: .
    image: ghcr.io/mpysiak/sylius-ai-assistant-demo:latest
    environment:
        APP_ENV: prod
        APP_DEBUG: 0
        APP_SECRET: ${APP_SECRET:-change-me-for-the-demo}
        DATABASE_URL: mysql://sylius:sylius@mysql/sylius_ai_assistant?serverVersion=8.4
        SYLIUS_ADMIN_MCP_SERVER_API_URL: http://app:8000/api/v2/admin/
    env_file:
        -   path: tests/TestApplication/.env.local
            required: false
    volumes:
        - media:/app/vendor/sylius/test-application/public/media
    depends_on:
        mysql:
            condition: service_healthy

services:
    app:
        <<: *app
        ports:
            - "${APP_PORT:-8000}:8000"
        healthcheck:
            test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/admin/login"]
            interval: 10s
            timeout: 5s
            retries: 60
            start_period: 120s

    worker:
        <<: *app
        command: ["php", "vendor/bin/console", "messenger:consume", "sylius_ai_assistant", "--time-limit=3600", "--memory-limit=256M", "-vv"]
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: sylius_ai_assistant
            MYSQL_USER: sylius
            MYSQL_PASSWORD: sylius
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    mysql-data: ~
    media: ~
