# Server deployment of the demo: pulls the published image, no build. Usage:
#   SERVER_NAME=demo.example.com ANTHROPIC_API_KEY=sk-ant-... APP_SECRET=$(openssl rand -hex 16) \
#   docker compose -f compose.deploy.yaml up -d
x-app: &app
    image: ghcr.io/mpysiak/sylius-ask-ai-demo:latest
    restart: unless-stopped
    environment:
        APP_ENV: prod
        APP_DEBUG: 0
        APP_SECRET: ${APP_SECRET:?set APP_SECRET}
        SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME to the public domain}
        DATABASE_URL: mysql://sylius:${MYSQL_PASSWORD:-sylius}@mysql/sylius_ask_ai?serverVersion=8.4
        SYLIUS_ADMIN_MCP_SERVER_API_URL: http://app:8000/api/v2/admin/
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
    depends_on:
        mysql:
            condition: service_healthy

services:
    app:
        <<: *app
        ports:
            - "80:80"
            - "443:443"
            - "443:443/udp"
        volumes:
            - caddy-data:/data
            - caddy-config:/config
            - media:/app/vendor/sylius/test-application/public/media
        healthcheck:
            test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/admin/login"]
            interval: 10s
            timeout: 5s
            retries: 60
            start_period: 120s

    worker:
        <<: *app
        command: ["php", "vendor/bin/console", "messenger:consume", "sylius_ask_ai", "--time-limit=3600", "--memory-limit=256M", "-vv"]
        depends_on:
            app:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-sylius}
            MYSQL_DATABASE: sylius_ask_ai
            MYSQL_USER: sylius
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sylius}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-sylius}"]
            interval: 5s
            timeout: 5s
            retries: 30

volumes:
    mysql-data: ~
    caddy-data: ~
    caddy-config: ~
    media: ~
