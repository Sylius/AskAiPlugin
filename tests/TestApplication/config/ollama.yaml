parameters:
    env(OLLAMA_ENDPOINT): 'http://127.0.0.1:11434'
    env(OLLAMA_MODEL): 'qwen3:4b?num_ctx=32768'

services:
    sylius_ask_ai_test.platform.ollama:
        class: Symfony\AI\Platform\Platform
        factory: ['Symfony\AI\Platform\Bridge\Ollama\Factory', 'createPlatform']
        arguments:
            - '%env(OLLAMA_ENDPOINT)%'
            - ~
            - '@http_client'
            - '@ai.platform.contract.ollama'
            - '@event_dispatcher'
        tags:
            - ai.platform

ai:
    agent:
        sylius_ask_ai:
            platform: sylius_ask_ai_test.platform.ollama
            model: '%env(OLLAMA_MODEL)%'
