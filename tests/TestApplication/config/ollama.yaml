# Runs the agent on a local Ollama instead of Anthropic, for development without an API bill.
# Not imported by default: add it to SYLIUS_TEST_APP_CONFIGS_TO_IMPORT in tests/TestApplication/.env.local:
#   SYLIUS_TEST_APP_CONFIGS_TO_IMPORT="@SyliusAiAssistantPlugin/tests/TestApplication/config/config.yaml;@SyliusAiAssistantPlugin/tests/TestApplication/config/ollama.yaml"
# Pull the model first: ollama pull qwen3:4b
# num_ctx: Ollama defaults to a 4096-token window and silently truncates the prompt from the front;
# the tool definitions alone are ~22k tokens, so without it the model sees only the tail of the tool list.
#
# The platform is defined by hand rather than through `ai.platform.ollama`: the bundle refuses that
# key when the bridge is only a dev dependency, which is what it is for the plugin itself.
# A shop configures `ai.platform.ollama` as the README shows.
parameters:
    env(OLLAMA_ENDPOINT): 'http://127.0.0.1:11434'
    env(OLLAMA_MODEL): 'qwen3:4b?num_ctx=32768'

services:
    sylius_ai_assistant_test.platform.ollama:
        class: Symfony\AI\Platform\Platform
        factory: ['Symfony\AI\Platform\Bridge\Ollama\Factory', 'createPlatform']
        arguments:
            - '%env(OLLAMA_ENDPOINT)%'
            - ~
            - '@http_client'
            - '@ai.platform.contract.ollama'
            - '@event_dispatcher'
        tags:
            - ai.platform

ai:
    agent:
        sylius_ai_assistant:
            platform: sylius_ai_assistant_test.platform.ollama
            model: '%env(OLLAMA_MODEL)%'
