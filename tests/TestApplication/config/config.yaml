imports:
    - { resource: "@SyliusAdminMcpServerPlugin/config/config.yaml" }
    - { resource: "@SyliusAskAiPlugin/config/config.yaml" }

sylius_ask_ai:
    prompt:
        additional_instructions: 'Our product codes look like Ethereal_Drift_T_Shirt.'
    navigation:
        pages:
            test-products: { repository: sylius.repository.product, field: code, show: sylius_admin_product_show, edit: sylius_admin_product_update, index: sylius_admin_product_index, search: search }
            exchange-rates: false

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

doctrine:
    dbal:
        charset: utf8mb4
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Sylius\AskAiPlugin

when@test:
    services:
        sylius_ask_ai_test.platform:
            class: Tests\Sylius\AskAiPlugin\Ai\ScriptedPlatform
            public: true
        sylius_ask_ai_test.tool.huge_result:
            class: Tests\Sylius\AskAiPlugin\Ai\HugeResultTool
            tags: [sylius_ask_ai.tool]
        test.sylius_ask_ai.chat:
            alias: sylius_ask_ai.chat
            public: true
        test.sylius_ask_ai.agent.context:
            alias: sylius_ask_ai.agent.context
            public: true
        test.sylius_ask_ai.navigation.admin_url_resolver:
            alias: sylius_ask_ai.navigation.admin_url_resolver
            public: true
        test.sylius_ask_ai.message_handler.run_agent_turn:
            alias: sylius_ask_ai.message_handler.run_agent_turn
            public: true
    ai:
        agent:
            sylius_ask_ai:
                platform: sylius_ask_ai_test.platform
                model: scripted

when@prod:
    services:
        doctrine.result_cache_provider: '@doctrine.result_cache_pool'
        doctrine.system_cache_provider: '@doctrine.system_cache_pool'
