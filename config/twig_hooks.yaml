sylius_twig_hooks:
    hooks:
        'sylius_admin.base#javascripts':
            ask_ai_panel:
                template: '@SyliusAskAiPlugin/hook/chat_panel.html.twig'
                priority: -100

        'sylius_ask_ai.chat_panel':
            header:
                template: '@SyliusAskAiPlugin/component/chat_panel/header.html.twig'
                priority: 200
            body:
                template: '@SyliusAskAiPlugin/component/chat_panel/body.html.twig'
                priority: 100
            footer:
                template: '@SyliusAskAiPlugin/component/chat_panel/footer.html.twig'
                priority: 0

        'sylius_ask_ai.chat_panel.header':
            title:
                template: '@SyliusAskAiPlugin/component/chat_panel/header/title.html.twig'
                priority: 200
            history:
                template: '@SyliusAskAiPlugin/component/chat_panel/header/history.html.twig'
                priority: 100
            new_chat:
                template: '@SyliusAskAiPlugin/component/chat_panel/header/new_chat.html.twig'
                priority: 0

        'sylius_ask_ai.chat_panel.body':
            empty_state:
                template: '@SyliusAskAiPlugin/component/chat_panel/body/empty_state.html.twig'
                priority: 100
            timeline:
                template: '@SyliusAskAiPlugin/component/chat_panel/body/timeline.html.twig'
                priority: 0

        'sylius_ask_ai.chat_panel.body.empty_state':
            intro:
                template: '@SyliusAskAiPlugin/component/chat_panel/body/empty_state/intro.html.twig'
                priority: 100
            suggestions:
                template: '@SyliusAskAiPlugin/component/chat_panel/body/empty_state/suggestions.html.twig'
                priority: 0

        'sylius_ask_ai.chat_panel.footer':
            composer:
                template: '@SyliusAskAiPlugin/component/chat_panel/footer/composer.html.twig'
                priority: 0

        'sylius_ask_ai.conversation.show.content.header.title_block':
            actions:
                template: '@SyliusAdmin/shared/crud/common/content/header/title_block/actions.html.twig'
                priority: -100

        'sylius_ask_ai.conversation.show.content.header.title_block.actions':
            resume:
                template: '@SyliusAskAiPlugin/admin/conversation/show/content/header/title_block/actions/resume.html.twig'
                priority: 0

        'sylius_ask_ai.conversation.show.content':
            sections:
                template: '@SyliusAskAiPlugin/admin/conversation/show/content/sections.html.twig'
                priority: 0

        'sylius_ask_ai.conversation.show.content.sections':
            general:
                template: '@SyliusAskAiPlugin/admin/conversation/show/content/sections/general.html.twig'
                priority: 100
            timeline:
                template: '@SyliusAskAiPlugin/admin/conversation/show/content/sections/timeline.html.twig'
                priority: 0

        'sylius_ask_ai.agent_action.show.content':
            sections:
                template: '@SyliusAskAiPlugin/admin/agent_action/show/content/sections.html.twig'
                priority: 0

        'sylius_ask_ai.agent_action.show.content.sections':
            general:
                template: '@SyliusAskAiPlugin/admin/agent_action/show/content/sections/general.html.twig'
                priority: 100
            details:
                template: '@SyliusAskAiPlugin/admin/agent_action/show/content/sections/details.html.twig'
                priority: 0
