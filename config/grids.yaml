# The read-only chat log in the admin: conversations and the agent's proposed actions (audit log).
# Loaded by the extension's prepend(), see SyliusAiAssistantExtension.
sylius_grid:
    grids:
        sylius_ai_assistant_admin_conversation:
            driver:
                name: doctrine/orm
                options:
                    class: '%sylius_ai_assistant.model.conversation.class%'
            sorting:
                createdAt: desc
            fields:
                id:
                    type: string
                    label: sylius.ui.id
                    sortable: ~
                topic:
                    type: twig
                    label: sylius_ai_assistant.ui.topic
                    path: .
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/conversation_topic.html.twig'
                adminUser:
                    type: string
                    label: sylius_ai_assistant.ui.administrator
                    path: adminUser.username
                    sortable: adminUser.username
                messages:
                    type: twig
                    label: sylius_ai_assistant.ui.messages
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/count.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
                state:
                    type: twig
                    label: sylius.ui.state
                    sortable: ~
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/state.html.twig'
                createdAt:
                    type: twig
                    label: sylius.ui.creation_date
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/date.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
                updatedAt:
                    type: twig
                    label: sylius.ui.updating_date
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/date.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
            filters:
                adminUser:
                    type: entity
                    label: sylius_ai_assistant.ui.administrator
                    form_options:
                        class: '%sylius.model.admin_user.class%'
                        choice_label: username
                state:
                    type: select
                    label: sylius.ui.state
                    form_options:
                        choices:
                            sylius_ai_assistant.ui.state.idle: !php/const Sylius\AiAssistantPlugin\Entity\ConversationStates::STATE_IDLE
                            sylius_ai_assistant.ui.state.running: !php/const Sylius\AiAssistantPlugin\Entity\ConversationStates::STATE_RUNNING
                            sylius_ai_assistant.ui.state.failed: !php/const Sylius\AiAssistantPlugin\Entity\ConversationStates::STATE_FAILED
                createdAt:
                    type: date
                    label: sylius.ui.creation_date
            actions:
                item:
                    show:
                        type: show
                        options:
                            link:
                                route: sylius_ai_assistant_admin_conversation_show
                                parameters:
                                    id: resource.id

        sylius_ai_assistant_admin_agent_action:
            driver:
                name: doctrine/orm
                options:
                    class: '%sylius_ai_assistant.model.agent_action.class%'
            sorting:
                createdAt: desc
            fields:
                id:
                    type: string
                    label: sylius.ui.id
                    sortable: ~
                conversation:
                    type: twig
                    label: sylius_ai_assistant.ui.conversation
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/conversation_link.html.twig'
                tool:
                    type: twig
                    label: sylius_ai_assistant.ui.tool
                    path: .
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/agent_action_tool.html.twig'
                state:
                    type: twig
                    label: sylius.ui.state
                    sortable: ~
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/state.html.twig'
                decidedBy:
                    type: twig
                    label: sylius_ai_assistant.ui.decided_by_user
                    options:
                        template: '@SyliusAiAssistantPlugin/admin/grid/field/admin_user.html.twig'
                decidedAt:
                    type: twig
                    label: sylius_ai_assistant.ui.decided_at
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/date.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
                createdAt:
                    type: twig
                    label: sylius.ui.creation_date
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/date.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
            filters:
                toolName:
                    type: string
                    label: sylius_ai_assistant.ui.tool
                state:
                    type: select
                    label: sylius.ui.state
                    form_options:
                        choices:
                            sylius_ai_assistant.ui.state.proposed: !php/const Sylius\AiAssistantPlugin\Entity\AgentActionStates::STATE_PROPOSED
                            sylius_ai_assistant.ui.state.approved: !php/const Sylius\AiAssistantPlugin\Entity\AgentActionStates::STATE_APPROVED
                            sylius_ai_assistant.ui.state.executed: !php/const Sylius\AiAssistantPlugin\Entity\AgentActionStates::STATE_EXECUTED
                            sylius_ai_assistant.ui.state.rejected: !php/const Sylius\AiAssistantPlugin\Entity\AgentActionStates::STATE_REJECTED
                            sylius_ai_assistant.ui.state.failed: !php/const Sylius\AiAssistantPlugin\Entity\AgentActionStates::STATE_FAILED
                decidedBy:
                    type: entity
                    label: sylius_ai_assistant.ui.decided_by_user
                    form_options:
                        class: '%sylius.model.admin_user.class%'
                        choice_label: username
                createdAt:
                    type: date
                    label: sylius.ui.creation_date
            actions:
                item:
                    show:
                        type: show
                        options:
                            link:
                                route: sylius_ai_assistant_admin_agent_action_show
                                parameters:
                                    id: resource.id
