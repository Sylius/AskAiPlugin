sylius_ask_ai_admin_conversation_index:
    path: /conversations
    methods: [GET]
    defaults:
        _controller: sylius_ask_ai.controller.conversation::indexAction
        _sylius:
            section: admin
            permission: true
            template: '@SyliusAdmin/shared/crud/index.html.twig'
            grid: sylius_ask_ai_admin_conversation
            vars:
                hook_prefix: sylius_ask_ai.conversation

sylius_ask_ai_admin_conversation_show:
    path: /conversations/{id}
    methods: [GET]
    defaults:
        _controller: sylius_ask_ai.controller.conversation::showAction
        _sylius:
            section: admin
            permission: true
            template: '@SyliusAdmin/shared/crud/show.html.twig'
            vars:
                hook_prefix: sylius_ask_ai.conversation

sylius_ask_ai_admin_conversation_resume:
    path: /conversations/{id}/resume
    methods: [POST]
    requirements:
        id: '\d+'
    defaults:
        _controller: sylius_ask_ai.controller.admin.resume_conversation

sylius_ask_ai_admin_agent_action_index:
    path: /agent-actions
    methods: [GET]
    defaults:
        _controller: sylius_ask_ai.controller.agent_action::indexAction
        _sylius:
            section: admin
            permission: true
            template: '@SyliusAdmin/shared/crud/index.html.twig'
            grid: sylius_ask_ai_admin_agent_action
            vars:
                hook_prefix: sylius_ask_ai.agent_action

sylius_ask_ai_admin_agent_action_show:
    path: /agent-actions/{id}
    methods: [GET]
    defaults:
        _controller: sylius_ask_ai.controller.agent_action::showAction
        _sylius:
            section: admin
            permission: true
            template: '@SyliusAdmin/shared/crud/show.html.twig'
            vars:
                hook_prefix: sylius_ask_ai.agent_action
